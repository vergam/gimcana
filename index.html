<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gimcana — v50</title>
<meta name="theme-color" content="#14120E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gimcana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14120E; --paper:#FBF7EF; --paper2:#F0E8D8;
  --cobalt:#1E3FCC; --magenta:#F0286E; --canary:#FFC814; --verd:#0E8A5F;
  --rule:rgba(20,18,14,.14);
  --display:'Anton','Haettenschweiler','Arial Narrow',Impact,sans-serif;
  --body:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(rgba(20,18,14,.042) 1px,transparent 1px);background-size:7px 7px}
#app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);background:var(--paper)}
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:space-between;padding:9px 14px}
.topbar .brand{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.topbar .brand em{font-style:normal;color:var(--canary)}
.topbar .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.75;text-align:right}
.main{flex:1;padding:22px 16px 118px}
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;
  padding:12px 14px 16px;background:linear-gradient(to top,var(--paper) 55%,rgba(251,247,239,0))}
.footbar-inner{width:100%;max-width:512px;display:flex;gap:8px}

h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(29px,9.5vw,44px);line-height:.92;margin:0 0 4px}
h2{font-family:var(--display);text-transform:uppercase;font-size:17px;letter-spacing:.02em;margin:0 0 10px;line-height:1}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--cobalt);margin:0 0 6px}
.lede{font-size:14px;opacity:.72;margin:0 0 18px}
.p14{font-size:14px;margin:0 0 16px}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.05em;opacity:.55;margin:8px 0 4px;text-transform:uppercase}
.hint{font-size:12.5px;opacity:.66;margin:9px 0 0;line-height:1.45}
.link-sm{background:none;border:none;text-decoration:underline;font-size:12.5px;opacity:.75;padding:8px 0 0;cursor:pointer;display:block}
.alerta-bg{position:fixed;inset:0;background:rgba(20,18,14,.82);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:60}
.alerta-box{background:var(--paper);border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--magenta);
  padding:22px 20px;max-width:380px;text-align:center}
.alerta-k{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:12px;
  color:var(--magenta);font-weight:700;margin:0 0 4px}
.alerta-box h1{font-size:26px;margin:0 0 12px}
.alerta-box p{font-size:14.5px;line-height:1.5;margin:0 0 10px}
.alerta-box .btn-cta{width:100%;margin-top:6px}

.cap{margin:0 0 30px}
.titol-in{font-family:var(--display)!important;text-transform:uppercase;font-size:20px!important;
  letter-spacing:.02em;margin:14px 0 0;border:2px solid var(--ink);background:var(--paper2);padding:11px 12px}
.resum{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--cobalt);margin:12px 0 0;line-height:1.5}
.bl{border-top:1.5px solid var(--ink);padding:16px 0 0;margin:0 0 30px}
.bl>h2{margin:0 0 12px}
.bl .row-input{margin-top:12px}
.row-b{display:flex;gap:8px;margin-top:10px}

/* material */
.taula-t{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;
  padding:11px 12px;border:1.5px solid var(--ink);background:var(--paper);font-size:13px;line-height:1.3}
.taula-t .tick{width:19px;height:19px;flex:none;border:1.5px solid var(--ink);display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--paper)}
.taula-t b{font-weight:700}
.taula-t.on{background:var(--canary);font-weight:500}
.taula-t.on .tick{background:var(--ink);color:var(--canary)}
.pres{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.pres button{font-size:12px;padding:7px 12px;border-width:1.5px;font-weight:500}
.pres button[aria-pressed=true]{background:var(--cobalt);color:var(--paper);font-weight:700}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media(max-width:360px){.mgrid{grid-template-columns:1fr}}
.mat{display:flex;align-items:center;gap:9px;text-align:left;padding:10px 10px;font-size:13.5px;
  border-width:1.5px;line-height:1.2}
.mat .tick{width:19px;height:19px;flex:none;border:1.5px solid var(--ink);display:grid;place-items:center;
  font-size:12px;font-weight:700;background:var(--paper)}
.mat[aria-pressed=true]{background:var(--canary);font-weight:700}
.mat[aria-pressed=true] .tick{background:var(--ink);color:var(--canary)}
.senyal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:14px 0 0;padding:9px 11px;
  border-left:5px solid var(--rule);background:var(--paper2)}
.senyal b{font-family:var(--display);text-transform:uppercase;font-size:13px;letter-spacing:.03em}
.senyal span{font-size:12.5px;opacity:.72}
.senyal.molt{border-left-color:var(--verd)}
.senyal.be{border-left-color:var(--cobalt)}
.senyal.just{border-left-color:var(--canary)}
.senyal.poc{border-left-color:var(--magenta);background:#fff}

/* durada */
.durada{display:flex;align-items:baseline;gap:9px;margin:14px 0 0}
.durada b{font-family:var(--display);font-size:26px;letter-spacing:-.01em;line-height:1}
.durada span{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.55}

/* punts */
.punts-f{display:flex;align-items:center;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.punts-f span{flex:1;font-size:13.5px;min-width:150px}

/* proves sorpresa */
.srp{display:flex;gap:12px;align-items:flex-start}
.srp-i{font-family:var(--display);font-size:34px;line-height:1;width:50px;height:50px;flex:none;
  display:grid;place-items:center;background:var(--canary);border:1.5px solid var(--ink)}
.srp b{font-size:14px}
.srp p{font-size:13px;margin:4px 0 0;opacity:.75}

button{font-family:var(--body);font-size:15px;cursor:pointer;border:1.5px solid var(--ink);
  background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:0;font-weight:500}
button:active{transform:translate(1px,1px)}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
button[disabled]{opacity:.35;cursor:not-allowed}
.btn-cta{flex:1;background:var(--magenta);color:var(--paper);font-family:var(--display);
  text-transform:uppercase;letter-spacing:.05em;font-size:19px;padding:15px 16px;box-shadow:4px 4px 0 var(--ink)}
.btn-cta.alt{background:var(--cobalt)}
.btn-cta.ghost{background:var(--paper);color:var(--ink)}
.btn-cta[disabled]{box-shadow:none;background:var(--paper2);color:rgba(20,18,14,.5)}
.btn-sm{font-size:12px;padding:5px 9px}
.btn-icon{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:14px;line-height:1}

input[type=text],input[type=number]{font-family:var(--body);font-size:16px;padding:9px 10px;
  border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);width:100%;border-radius:0}
input:focus-visible{outline:3px solid var(--cobalt);outline-offset:1px}
.row-input{display:flex;gap:8px}
.seg{display:flex;margin:0 0 10px;border:1.5px solid var(--ink);width:100%}
.seg button{flex:1;border:0;border-right:1.5px solid var(--ink);background:var(--paper);font-size:12.5px;padding:9px 3px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--cobalt);color:var(--paper);font-weight:700}

.bib,.eq-d{font-family:var(--mono);font-weight:700;font-size:11px;display:grid;place-items:center;
  min-width:22px;height:22px;background:var(--ink);color:var(--paper);flex:none}
.eq-d{background:var(--c,var(--ink));color:#fff}
.plist{display:flex;flex-direction:column;gap:6px}
.pill .nm{font-size:14.5px}
.pill{display:flex;align-items:center;gap:9px;border:1.5px solid var(--ink);padding:5px 7px}
.pill .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{border:1.5px dashed var(--rule);padding:14px;text-align:center;font-size:13px;opacity:.6}

.eqs{display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
.eq{border:1.5px solid var(--ink);border-left:6px solid var(--c)}
.eq-h{display:flex;align-items:center;gap:8px;padding:6px 8px}
.seg.sub{margin-top:-1.5px}
.eq-in{font-family:var(--display);text-transform:uppercase;font-size:14px;letter-spacing:.02em;
  border:0;border-bottom:1.5px dashed var(--rule);background:transparent;padding:2px 0;width:100%}
.eq-in:focus-visible{outline:0;border-bottom-color:var(--cobalt);background:var(--paper2)}
.eq-n{font-family:var(--display);text-transform:uppercase;font-size:14px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-m{display:flex;flex-wrap:wrap;gap:5px;padding:0 8px 8px}
.mem{font-size:12px;padding:3px 8px;background:var(--paper2);border-width:1px}


.cat{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.cg{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid var(--rule);cursor:pointer}
.cg input{width:19px;height:19px;accent-color:var(--cobalt);flex:none;margin:0}
.cg.bloq{opacity:.4;cursor:default}
.cg-x{width:19px;text-align:center;font-family:var(--mono);flex:none}
.cg-p{color:var(--ink);display:grid;place-items:center;flex:none}
.cg-t{flex:1;display:flex;flex-direction:column;min-width:0}
.cg-t b{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-t i{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.55;font-style:normal}
.cg-e{font-size:9px;letter-spacing:1px;color:var(--magenta);flex:none}
.picto{display:block}

.ptab{display:flex;flex-wrap:wrap;gap:5px}
.ptab .cell{width:calc(20% - 4px)}
.ptab .cell .lab{font-family:var(--mono);font-size:10px;opacity:.6;text-align:center;margin-bottom:2px}
.ptab input{text-align:center;font-family:var(--mono);font-weight:700;padding:7px 2px}

.carwrap{position:relative;margin:clamp(18px,13vh,112px) 0 22px}
/* visor: parèntesis de cantonada + guia central, en comptes d'una caixa tancada */
.car-mark{position:absolute;top:-10px;bottom:-10px;left:50%;transform:translateX(-50%);
  width:min(196px,calc(100% / 1.95));z-index:4;pointer-events:none}
.car-mark span{position:absolute;width:18px;height:18px;border:3px solid var(--magenta)}
.car-mark span:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.car-mark span:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.car-mark span:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.car-mark span:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.car-mark:before{content:'';position:absolute;top:50%;left:-11px;transform:translateY(-50%);
  border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid var(--magenta)}
.car-mark:after{content:'';position:absolute;top:50%;right:-11px;transform:translateY(-50%);
  border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:11px solid var(--magenta)}
.carrusel{position:relative;overflow:hidden;padding:22px 0;perspective:1150px;perspective-origin:50% 50%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
/* solc: dóna la sensació que les cartes corren per un rail */
.carrusel:before{content:'';position:absolute;left:0;right:0;top:50%;height:1.5px;
  background:repeating-linear-gradient(90deg,var(--rule) 0 7px,transparent 7px 15px);z-index:0}
.car-track{display:flex;gap:14px;will-change:transform;transform-style:preserve-3d}
.card{flex:0 0 auto;width:172px;height:158px;border:1.5px solid var(--ink);
  background:linear-gradient(168deg,var(--paper) 0%,var(--paper) 58%,var(--paper2) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px 10px;
  box-shadow:3px 3px 0 var(--ink);position:relative;z-index:1;
  transition:background .25s,box-shadow .25s;backface-visibility:hidden}
.card-f{position:absolute;top:7px;left:9px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.38}
.card-p{color:var(--cobalt);display:grid;place-items:center;transition:color .25s}
.card-n{font-family:var(--display);text-transform:uppercase;font-size:14px;line-height:1.05;text-align:center;
  letter-spacing:.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* la carta guanyadora s'encunya: sobrepassa i s'assenta */
.car-track.fet .card:not(.guanyadora){opacity:.22!important;filter:grayscale(1) blur(1.4px)!important;transition:opacity .45s,filter .45s}
.card.guanyadora{background:var(--canary);box-shadow:6px 6px 0 var(--ink);z-index:5;
  animation:encunya .5s cubic-bezier(.2,1.5,.35,1) both}
.card.guanyadora .card-p{color:var(--ink)}
.card.guanyadora .card-f{opacity:.6}
@keyframes encunya{
  0%{transform:scale(1.22) rotate(-2.5deg)}
  55%{transform:scale(1.02) rotate(.8deg)}
  100%{transform:scale(1.08) rotate(0)}
}
/* halo curt en encertar */
.card.guanyadora:after{content:'';position:absolute;inset:-9px;border:2.5px solid var(--magenta);
  animation:halo .55s ease-out forwards;pointer-events:none}
@keyframes halo{0%{opacity:1;inset:-2px}100%{opacity:0;inset:-22px}}
.topaj{background:none;border:0;color:var(--paper);font-size:16px;opacity:.75;padding:0 0 0 10px;cursor:pointer}
.normes{border:1.5px solid var(--ink);background:var(--canary);box-shadow:3px 3px 0 var(--ink);margin:0 0 14px}
.normes-h{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:9px 11px;
  font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;cursor:pointer}
.normes-t{flex:1;text-align:left}
.normes-p{font-size:13px}
.normes-l{border-top:1.5px solid var(--ink);padding:4px 11px 10px}
.normes-i{padding:8px 0;border-bottom:1px solid rgba(20,18,14,.16)}
.normes-i:last-child{border-bottom:0}
.normes-i b{display:block;font-family:var(--display);text-transform:uppercase;font-size:14px;letter-spacing:.01em}
.normes-i span{display:block;font-size:13px;line-height:1.45;margin-top:2px}
.ajrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.ajrow span{font-size:14.5px;font-weight:500}
.sw{min-width:62px;padding:7px 10px;border:1.5px solid var(--ink);background:var(--paper);font-weight:700;
  font-family:var(--mono);font-size:12px;cursor:pointer}
.sw.on{background:var(--verd);color:var(--paper)}
.pmbtn{width:38px;height:38px;flex:none;border:1.5px solid var(--ink);background:var(--paper);
  font-family:var(--display);font-size:19px;line-height:1;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.pmbtn:active{transform:translate(2px,2px);box-shadow:none}
.numrow .numval{width:56px}
.sorpresa{border-width:2.5px}
.srp{display:flex;gap:12px;align-items:flex-start}
.srp-i{font-family:var(--display);font-size:36px;line-height:1;width:52px;height:52px;flex:none;
  display:grid;place-items:center;background:var(--canary);border:1.5px solid var(--ink)}
.srp b{font-size:14px}
.srp p{font-size:13px;margin:4px 0 0;opacity:.75}
.gcard{border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--cobalt);padding:16px;margin:0 0 14px;background:var(--paper)}
.gc-p{color:var(--magenta);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.chip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border:1.5px solid var(--ink);padding:4px 7px}
.chip.fill{background:var(--canary)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 10px 30px;font-size:14px}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;font-family:var(--mono);font-weight:700;font-size:11px;
  width:20px;height:20px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.callout{border-left:4px solid var(--magenta);background:var(--paper2);padding:10px 12px;margin:14px 0 0;font-size:13.5px}
.callout b{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;color:var(--magenta)}

.eina.porta{border-left-color:var(--magenta)}
.porta-q{font-family:var(--display);text-transform:uppercase;font-size:17px;margin:0 0 10px;line-height:1.05}
.portab{display:flex;flex-direction:column;gap:6px}
.portab button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;
  font-size:15px;font-weight:500;background:var(--paper);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.portab button i{font-family:var(--mono);font-style:normal;font-size:10.5px;opacity:.5}
.portab button.qual{font-style:italic;opacity:.75}
.eina.consig{border-left-color:var(--magenta)}
.cg-box{border:1.5px solid var(--ink);background:var(--paper2);padding:16px 12px;text-align:center}
.cg-box.sona{background:var(--cobalt);color:var(--paper);border-color:var(--ink)}
.cg-box.off{background:var(--paper)}
.cg-box.espera{background:var(--ink);color:var(--paper)}
.cg-k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin:0}
.cg-n{font-family:var(--display);text-transform:uppercase;font-size:34px;line-height:1;margin:4px 0 0}
.cg-box.sona .cg-n{font-size:22px}
.cg-t{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin:8px 0 0}
.cg-box.sona .cg-t{opacity:.85}
.cg-t b{font-size:15px}
.difsel{display:flex;gap:5px;margin:0 0 10px}
.difsel button{flex:1;font-size:11px;padding:6px 4px;border-width:1.5px;background:var(--paper)}
.difsel button[aria-pressed=true]{background:var(--cobalt);color:var(--paper);font-weight:700}
.lletres{margin:12px 0 0;border-top:1px solid var(--rule);padding-top:8px}
.ll{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:14px}
.ll-k{font-family:var(--mono);font-weight:700;font-size:12px;width:22px;height:22px;flex:none;
  display:grid;place-items:center;background:var(--canary);border:1.5px solid var(--ink)}
.torn{border:1.5px solid var(--ink);border-left:6px solid var(--c);padding:14px;margin:8px 0 0;text-align:center}
.torn-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin:0}
.torn-n{font-family:var(--display);text-transform:uppercase;font-size:30px;line-height:1;margin:4px 0 12px}
.crono{font-family:var(--mono);font-weight:700;font-size:48px;text-align:center;border:1.5px solid var(--ink);

function fit(base,n){ const o=[]; for(let i=0;i<n;i++) o.push(base[i]??0); return o; }

function resoldre(files, punts){
  const res={}, actius=files.filter(f=>!f.absent), grups=[];
  actius.forEach((f,i)=>{ if(i===0||!f.tied) grups.push([f]); else grups[grups.length-1].push(f); });
  let pos=1;
  grups.forEach(g=>{
    let m=0; for(let k=0;k<g.length;k++) m = Math.max(m, punts[pos-1+k] ?? 0);
    g.forEach(f=> res[f.eid]={pos, pts:m, ex:g.length>1});
    pos += g.length;
  });
  files.filter(f=>f.absent).forEach(f=> res[f.eid]={pos:null, pts:0, absent:true});
  return res;
}

      total+=x.pts; if(x.pos===1) vic++;
      if(x.pos){ sp+=x.pos; n++; }
    });
    return {...e, total:Math.round(total*10)/10, vic, mitjana:n?sp/n:99};
  }).sort((a,b)=> b.total-a.total || b.vic-a.vic || a.mitjana-b.mitjana || a.nom.localeCompare(b.nom,'ca'));
}

const triaAleatori = a => a[Math.floor(Math.random()*a.length)];
function generaAlerta(def){
  let cos=def.cos;
  if(cos.includes('{A}')||cos.includes('{B}')){
    const p=triaAleatori((typeof CONTINGUT!=='undefined'&&CONTINGUT.ParaulesProhibides&&CONTINGUT.ParaulesProhibides.length)?CONTINGUT.ParaulesProhibides:[['sí','no']]);
    cos=cos.replace('{A}',p[0]).replace('{B}',p[1]);
  }
  if(cos.includes('{F}')){
    const f=triaAleatori((typeof CONTINGUT!=='undefined'&&CONTINGUT.FrasesMaleides&&CONTINGUT.FrasesMaleides.length)?CONTINGUT.FrasesMaleides:['quin caloret']);
    cos=cos.replace('{F}',f);
  }
  if(cos.includes('{N}')) cos=cos.replace('{N}',String(2+Math.floor(Math.random()*8)));
  return {titol:def.titol, cos};
}

  const tipusValids = barreja(totes.filter(a=>!a.format||a.format===S.format));
  S.horariAlertes = rondesTriades.map((ronda,i)=>({ronda, tipus:(tipusValids[i%Math.max(tipusValids.length,1)]||totes[0]).id}));
  S.properaAlerta = 0;
}

function ferEquips(){
  const g=[...S.gent];
  for(let i=g.length-1;i>0;i--){ const k=Math.floor(Math.random()*(i+1)); [g[i],g[k]]=[g[k],g[i]]; }
  if(S.format==='ind'){
    S.equips = g.sort((a,b)=>a.bib-b.bib).map((p,i)=>({id:'e'+p.id, nom:p.nom, membres:[p.id], c:i%4}));
  } else if(S.format==='par'){
    S.equips=[];
    for(let i=0;i<g.length;i+=2){
      if(!g[i+1] && S.equips.length){ S.equips[S.equips.length-1].membres.push(g[i].id); recalcNom(S.equips[S.equips.length-1]); break; }
      const m=[g[i]]; if(g[i+1]) m.push(g[i+1]);
      S.equips.push({id:'e'+i+'_'+Date.now(), nom:'', membres:m.map(x=>x.id), c:S.equips.length%4});
      recalcNom(S.equips[S.equips.length-1]);
    }
  } else {
    const n=Math.min(S.nEquips, Math.max(2,g.length));
    const bossa=barrejaNoms([...NOMS_EQUIP]);
    S.equips = Array.from({length:n},(_,i)=>({id:'eq'+i, nom:bossa[i]||('Equip '+'ABCD'[i]), membres:[], c:i%4}));
    g.forEach((p,i)=> S.equips[i%n].membres.push(p.id));
  }
  ajustaPunts();
}

function tempsProva(g, unitats){
  const n=Math.max(unitats,2), base=g.min||5;
  let f = g.escala==='torns' ? n/6
        : g.escala==='rondes' ? 1+0.10*(n-6)
        : 1+0.02*(n-6);
  return base*Math.min(3,Math.max(.5,f));
}
function duradaEstimada(){
  const disp=disponibles(); if(!disp.length) return null;
  const u=S.equips.length||S.gent.length||2;
  const mitjana=disp.reduce((a,g)=>a+tempsProva(g,u),0)/disp.length;
  const total=(mitjana+1.5)*totalRondes();
  const r=x=>Math.max(5,Math.round(x/5)*5);
  return [r(total*0.82), r(total*1.28)];
}

  return d ? (d[0]===d[1] ? `uns ${d[0]} min` : `${d[0]}\u2013${d[1]} min`) : '';

const CLAU='gimcana:sessio-v4';
const MEM={};
const Magatzem={
  async get(k){
    try{ if(typeof window!=='undefined'&&window.storage){ const r=await window.storage.get(k); return r&&r.value?JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){}
    return MEM[k]!==undefined?MEM[k]:null;
  },
  async set(k,v){
    const t=JSON.stringify(v);
    try{ if(typeof window!=='undefined'&&window.storage){ await window.storage.set(k,t); return 'storage'; } }catch(e){}
    try{ localStorage.setItem(k,t); return 'local'; }catch(e){}
    MEM[k]=v; return 'memoria';
  },
  async esborra(k){
    try{ if(typeof window!=='undefined'&&window.storage){ await window.storage.delete(k); return; } }catch(e){}
    try{ localStorage.removeItem(k); return; }catch(e){}
    delete MEM[k];
  },
};

let AC=null;
function ac(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
       if(AC.state==='suspended') AC.resume(); }catch(e){}
  return AC;
}
function to(freq,inici,durada,vol,tipus){
  if(!pref('so',true)) return;
  const c=ac(); if(!c) return;
  const t=c.currentTime+inici, o=c.createOscillator(), g=c.createGain();
  o.type=tipus||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+durada);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+durada+0.02);
}
const xiulet = ()=>{ to(1046,0,.16,.4); to(1318,.17,.16,.4); to(1568,.34,.34,.45); };

    if(!pref('veuon',true)) return;

    const u=new SpeechSynthesisUtterance(t);
    u.lang='ca-ES'; u.rate=.95;
    const v=veuActual();

}

function veuTriada(){ try{ return localStorage.getItem(veuKey())||''; }catch(e){ return ''; } }
function triaVeu(uri){ try{ localStorage.setItem(veuKey(), uri||''); }catch(e){} }
function veusCatalanes(){
  if(!window.speechSynthesis) return [];

function difsDe(llista){

  const set=new Set(f.map(x=>dif(x)).filter(Boolean));
  return ['Fàcil','Mitjà','Difícil'].filter(d=>set.has(d));

function calTriarDif(g){ return !!(g.unic && difsDe(g.llista).length); }
function iniSorteig(g, difTriada, triat){
  // les proves d'un sol element demanen la dificultat ABANS de revelar res
  if(calTriarDif(g) && !triat){
    EI.sorteig={pool:[], i:-1, llista:g.llista, dif:null, triat:false};
    return;
  }
  const font=(typeof CONTINGUT!=='undefined' && CONTINGUT[g.llista])||[];
  const dispDifs=difsDe(g.llista);
  const d = (difTriada && dispDifs.includes(difTriada)) ? difTriada : null;
  let base = d ? font.filter(x=>dif(x)===d) : font;
  if(!S.usats[g.llista]) S.usats[g.llista]=[];
  let pool=base.filter(x=>!S.usats[g.llista].includes(txt(x)));
  if(!pool.length){ S.usats[g.llista]=[]; pool=[...base]; }
  EI.sorteig={pool:barreja([...pool]), i:-1, llista:g.llista, dif:d, triat:true};
  seguent();
}
function seguent(){
  const s=EI.sorteig; if(!s.pool.length) return;
  s.i++;
  if(s.i>=s.pool.length){ S.usats[s.llista]=[]; barreja(s.pool); s.i=0; }
  const a=s.pool[s.i];
  if(!S.usats[s.llista].includes(txt(a))) S.usats[s.llista].push(txt(a));
}
const actual = () => EI.sorteig.pool[EI.sorteig.i];

function compteGo(){

  if(C.fet||C.restant<=0){ C.restant=C.total; C.fet=false; }
  ac(); C.corrent=true;

/* ---- música ---- */
function synthOn(estil){
  const c=ac(); if(!c) return null;
  if(estil==='mogut'){
    /* baix marcant el ritme + melodia sincopada + xarles: fa moure els peus */
    const baix=[130.81,0,130.81,0, 174.61,0,130.81,0, 155.56,0,155.56,0, 196.00,0,174.61,0];
    const melo=[0,659.25,0,783.99, 880.00,0,783.99,659.25, 0,587.33,0,698.46, 783.99,0,659.25,0];
    let i=0;
    return setInterval(()=>{
      const k=i%16;
      if(baix[k]) to(baix[k],0,.13,.24,'square');
      if(melo[k]) to(melo[k],0,.10,.12,'triangle');
      if(k%4===0) to(1400,0,.025,.05,'square');
      i++;
    },125);
  }
  const n=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,783.99,659.25,587.33];
  let i=0;
  return setInterval(()=>to(n[i++%n.length],0,.2,.13,'triangle'),195);
}
function paraMusica(silenci){
  const M=EI.musica;
  if(M.timer){ clearTimeout(M.timer); M.timer=null; }
  if(M.synth){ clearInterval(M.synth); M.synth=null; }
  if(M.au){ try{ M.au.pause(); }catch(e){} }
  const anava=M.sonant; M.sonant=false;
  if(anava&&!silenci){ xiulet(); flaix(); }
}
function musicaGo(g){
  const M=EI.musica;
  if(M.sonant){ paraMusica(); pintaEines(); return; }
  ac();
  if(M.au){ try{ M.au.currentTime=Math.random()*Math.max(0,(M.au.duration||30)-20); M.au.loop=true; M.au.play(); }catch(e){} }
  else M.synth=synthOn(g.so);
  M.sonant=true;
  const [a,b]=g.rang||[8,25];
  M.timer=setTimeout(()=>{ paraMusica(); pintaEines(); }, (a+Math.random()*(b-a))*1000);

function consigParaTot(silenci){
  const C=EI.consig;
  if(C.timer){ clearTimeout(C.timer); C.timer=null; }
  if(C.tic){ clearInterval(C.tic); C.tic=null; }
  const M=EI.musica;
  if(M.synth){ clearInterval(M.synth); M.synth=null; }
  if(M.au){ try{ M.au.pause(); }catch(e){} }
  M.sonant=false;
  const anava=C.fase!=='aturat';
  C.fase='aturat'; C.restant=0;
  if(anava && !silenci){ xiulet(); flaix(); }
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
}
function consigMusica(g){
  const C=EI.consig, M=EI.musica;
  if(g.senseMusica){
    M.sonant=false; C.fase='espera';
  } else {
    ac();
    if(M.au){ try{ M.au.loop=true; M.au.play(); }catch(e){} } else M.synth=synthOn(g.so);
    M.sonant=true; C.fase='musica';
  }
  const [a,b]=g.cicle||[10,15];
  C.timer=setTimeout(()=>consigCanta(g), (a+Math.random()*(b-a))*1000);
  pintaEines();
}
function consigCanta(g){
  const C=EI.consig, M=EI.musica;
  // atura la música de cop
  if(M.synth){ clearInterval(M.synth); M.synth=null; }
  if(M.au){ try{ M.au.pause(); }catch(e){} }
  M.sonant=false;
  // tria una consigna diferent de l'anterior
  const llista=(g.consignes||[]).filter(x=>x!==C.ant);
  const nova=llista.length?llista[Math.floor(Math.random()*llista.length)]:(g.consignes||[''])[0];
  C.ant=nova; C.actual=nova; C.fase='consigna';
  C.restant=g.pausa||5;
  xiulet(); flaix(); parla(nova);

/* refresca el resum i la durada sense reconstruir la pantalla */
function refrescaResum(){
  if(S.pantalla!=='muntatge') return;
  const el=document.getElementById('resum'); if(!el) return;
  const nG=S.gent.length, nE=S.equips.length;
  const prou = nG>=2 && nE>=2 && disponibles().length>=S.rondes;
  el.textContent=[
    nG?`${nG} ${nG===1?'persona':'persones'}`:null,
    nE>=2?FORMATS[S.format].curt.toLowerCase()+(S.format==='eq'?` de ${nE}`:''):null,
    S.sobretaula?'sobretaula':{in:'a cobert',out:'a fora',both:'on sigui'}[S.lloc],
    `${S.rondes} proves`,
    prou?ventall():null,
  ].filter(Boolean).join(' · ')||'Comença afegint qui hi juga';
}

function afegeixPersona(){
  const el=document.getElementById('nouNom'); if(!el) return;
  const trossos=(el.value||'').split(/[,;\n\t]+/).map(x=>x.trim()).filter(Boolean);
  if(!trossos.length) return;
  const ja=new Set(S.gent.map(p=>p.nom.toLowerCase()));
  trossos.forEach(nom=>{
    const n=nom.slice(0,16);
    if(ja.has(n.toLowerCase())) return;
    ja.add(n.toLowerCase());
    S.gent.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,5), nom:n, bib:S.seguentBib++});
  });
  el.value=''; ferEquips(); render();
  const x=document.getElementById('nouNom'); if(x) x.focus();
}
function afegeixJoc(){
  const el=document.getElementById('nouJoc'), nom=el.value.trim(); if(!nom) return;
  S.propies.push({id:'x'+Date.now(), nom, fam:'destresa', lloc:'both', mat:[], min:5, energia:2,
    modes:['ind','par','eq'], mesura:'ordre', unitat:'',
    passos:['Aquesta prova l\u2019has afegit tu: les normes les poses tu.','Explica-les en veu alta abans de començar.','Deixa clar com es decideix qui guanya.'],
    ordre:'Toca els participants en l\u2019ordre en què acaben.'});
  el.value=''; render(); const x=document.getElementById('nouJoc'); if(x) x.focus();
}

/* ---------- CARRUSEL ----------
   La tira barreja proves de tot el catàleg disponible amb repeticions,
   així és impossible deduir quantes proves hi ha. */
function construeixTirada(){
  const pool=bombo(); if(!pool.length) return null;
  const decoys=disponibles();
  // evita que surtin dues proves seguides de la mateixa família, si hi ha alternativa
  const ultima=S.jugades.length?joc(S.jugades[S.jugades.length-1].gid):null;
  const altres=ultima?pool.filter(g=>g.fam!==ultima.fam):[];
  const font=altres.length?altres:pool;
  const objectiu=font[Math.floor(Math.random()*font.length)];
  const IDX=24, tira=[];
  for(let i=0;i<IDX;i++) tira.push(decoys[Math.floor(Math.random()*decoys.length)]);
  tira.push(objectiu);
  for(let i=0;i<6;i++) tira.push(decoys[Math.floor(Math.random()*decoys.length)]);
  return {tira, idx:IDX, gid:objectiu.id};
}
function pCarrusel(){
  if(!S.tirada) S.tirada=construeixTirada();
  const T=S.tirada, ronda=S.jugades.length+1;
  const cartes=T.tira.map((g,i)=>`<div class="card" data-i="${i}"><span class="card-f">${esc(g.fam)}</span><span class="card-p">${picto(g.fam,42)}</span><span class="card-n">${esc(g.nom)}</span></div>`).join('');
  return {
   meta:`prova ${ronda} de ${totalRondes()}`,
   html:`<p class="eyebrow">${esc(S.titol)} · prova ${ronda} de ${totalRondes()}</p>
   <h1>Quina<br>toca ara</h1>
   <p class="lede">No ho sabreu fins que pari.</p>
   <div class="carwrap">
     <div class="car-mark"><span></span><span></span><span></span><span></span></div>
     <div class="carrusel" id="car"><div class="car-track" id="track">${cartes}</div></div>
   </div>`,
   foot:`<button class="btn-cta" id="tira">Tira</button>`,
   after(){
     const car=document.getElementById('car'), tk=document.getElementById('track');
     if(car&&tk&&tk.children.length){
       const ini=tk.children[Math.min(3,tk.children.length-1)];
       tk.style.transition='none';
       tk.style.transform=`translateX(${car.clientWidth/2-(ini.offsetLeft+ini.offsetWidth/2)}px)`;
       profunditat();
     }
     document.getElementById('tira').onclick=tirar;
   }};
}
/* Cada carta es gira i s'allunya segons la distància al centre del visor.
   Es recalcula per fotograma mentre la tira corre. */
function profunditat(){
  const car=document.getElementById('car'); if(!car) return;
  const cx=car.getBoundingClientRect().left+car.clientWidth/2;
  const cartes=car.querySelectorAll('.card');
  for(const c of cartes){
    if(c.classList.contains('guanyadora')){ c.style.transform=''; continue; }
    const r=c.getBoundingClientRect();
    if(r.right<-260||r.left>window.innerWidth+260){ c.style.opacity='0'; continue; }
    const d=(r.left+r.width/2-cx)/car.clientWidth;      // -0.5 .. 0.5 aprox
    const a=Math.min(Math.abs(d),1);
    c.style.transform=`translateZ(${-250*a}px) rotateY(${-54*d}deg) scale(${1-.08*a})`;
    c.style.opacity=String(1-.55*a);
    c.style.filter=a>.25?`blur(${Math.min((a-.25)*5,2.2)}px)`:'';
    c.style.zIndex=String(20-Math.round(a*20));
  }
}
function tirar(){
  if(S.tirant||!S.tirada) return;
  S.tirant=true;
  const b=document.getElementById('tira'); b.disabled=true; b.textContent='…';
  const car=document.getElementById('car'), tk=document.getElementById('track');
  const cards=[...tk.children], T=S.tirada;
  const pas=cards.length>1 ? cards[1].offsetLeft-cards[0].offsetLeft : 178;
  const jitter=(Math.random()*20)-10;
  const desti=-(T.idx*pas)+(car.clientWidth-cards[0].offsetWidth)/2+jitter;
  const lent = typeof window.matchMedia==='function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const acabar=()=>{
    tk.classList.add('fet');
    cards[T.idx].classList.add('guanyadora');
    setTimeout(()=>{
      S.tirant=false; S.provaActual=T.gid; S.tirada=null; S.pantalla='prova'; S.jugant=false;
      if(S.horariAlertes===null) planificaAlertes();
      const prop=S.horariAlertes[S.properaAlerta];
      if(prop && S.jugades.length===prop.ronda){
        const totes=(typeof ALERTES!=='undefined'&&ALERTES.length)?ALERTES:[];
        const def=totes.find(a=>a.id===prop.tipus)||totes[0];
        if(def){ S.alertaActual=generaAlerta(def); S.mostraAlerta=true; }
        S.properaAlerta++;
        S.normes.push({t:S.alertaActual.titol, c:S.alertaActual.cos}); vibra([140,80,140]);
      }
      render();
    }, lent?200:950);
  };
  if(lent){ tk.style.transition='none'; tk.style.transform=`translateX(${desti}px)`; profunditat(); acabar(); }
  else{
    void tk.offsetWidth;
    tk.style.transition='transform 3.8s cubic-bezier(.09,.72,.05,1)';
    requestAnimationFrame(()=>{ tk.style.transform=`translateX(${desti}px)`; });
    let corrent=true;
    (function bucle(){ if(!corrent) return; profunditat(); requestAnimationFrame(bucle); })();
    setTimeout(()=>{ corrent=false; profunditat(); },3900);
    setTimeout(acabar,3900);
  }
}

/* ---------- PROVA ---------- */
function pProva(){
  const g=joc(S.provaActual);
  const mat=g.mat.length?g.mat.map(m=>MATERIAL[m]).join(' · '):'Res, només vosaltres';
  const potSaltar = S.passes>0 && bombo().length>1;
  const alerta = S.mostraAlerta && S.alertaActual ? `<div class="alerta-bg" data-alerta="tanca">
      <div class="alerta-box">
        <p class="alerta-k">Norma alert</p>
        <h1>${esc(S.alertaActual.titol)}</h1>
        <p>${esc(S.alertaActual.cos)}</p>
        <p class="hint">No hi ha manera d\u2019aplicar-ho des de l\u2019app: és de paraula, i qui trenqui la norma, que ho pagui com decidiu.</p>
        <button class="btn-cta" data-alerta="tanca">Entesos</button>
      </div></div>` : '';
  return {
   meta:`prova ${S.jugades.length+1} de ${totalRondes()}`,
   html:`${alerta}<p class="eyebrow">Prova ${S.jugades.length+1}</p>
   <div class="gcard">
     <div class="gc-p">${picto(g.fam,60)}</div>
     <h1>${esc(g.nom)}</h1>

     <h2>Material</h2><p class="p14">${esc(mat)}</p>
     <h2>Com es juga</h2><ol class="steps">${g.passos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
     <div class="callout"><b>Com es puntua</b>${esc(g.ordre)}</div>
   </div>
   ${potSaltar?`<button class="btn-sm" id="salta">Aquesta no · en queden ${S.passes}</button>
     <p class="hint">Per si algú està lesionat o no us convenç. Un cop descartada, no torna a sortir.</p>`:''}`,
   foot:`<button class="btn-cta" data-joc="juga">Comença</button>`,
   after(){
     if(g.eines||g.mostraTorns){ preparaEines(g); pintaEines(); }
     document.querySelectorAll('[data-alerta]').forEach(b=>b.onclick=()=>{ S.mostraAlerta=false; render(); });
     const s=document.getElementById('salta');
     if(s) s.onclick=()=>{ S.saltades.add(S.provaActual); S.passes--; S.tirada=null; S.pantalla='carrusel'; render(); };
     const va=document.getElementById('va');
     if(va) va.onclick=()=>{
       const nums={};
       if(g.puntuaTorn) (S.equips.length?S.equips:S.gent).forEach(p=>{ if(EI.punts[p.id]) nums[p.id]=String(EI.punts[p.id]); });
       S.entrada={taps:[],t0:null,nums}; S.pantalla='entrada'; render();
     };
   }};
}

  if(esPunts){
    cos=`<div class="nums">${S.equips.map(e=>`<div class="numrow" style="--c:${COLORS[e.c]}">
        <span class="eq-d">${S.equips.indexOf(e)+1}</span><span class="nm">${esc(e.nom)}</span>

             <input type="number" inputmode="numeric" data-num="${e.id}" value="${E.nums[e.id]??''}" placeholder="0">
             <button class="pm" data-pm="+|${e.id}" aria-label="Un més">+</button>`}
        <span class="un">${esc(g.unitat)}</span></div>`).join('')}</div>

      ${recordatoriPunts()}`;
  } else if(esTemps && g.torns){
    const fets=E.taps.map(t=>t.eid);
    const actualJ=S.equips.find(e=>!fets.includes(e.id));
    cos=`${E.taps.length?`<div class="tapped"><p class="mini">Temps de cada un</p>
        ${E.taps.map((t,i)=>{const e=S.equips.find(x=>x.id===t.eid);
          return `<div class="tr"><span class="tr-i">${i+1}</span><span class="nm">${esc(e.nom)}</span><span class="tr-t">${fmtT(t.ms)}</span></div>`;}).join('')}

        ${E.t0===null

function arrencaCrono(){
  if(cronoInt){ clearInterval(cronoInt); cronoInt=null; }
  cronoInt=setInterval(()=>{
    const el=document.getElementById('crono');
    if(el && S.entrada && S.entrada.t0) el.textContent=fmtT(Date.now()-S.entrada.t0);

}
/* l'últim ha tocat: el rellotge s'atura i es queda amb el temps final */
function acabaCrono(){
  if(cronoInt){ clearInterval(cronoInt); cronoInt=null; }
  const el=document.getElementById('crono'); if(!el) return;
  const t=S.entrada.taps.length?S.entrada.taps[S.entrada.taps.length-1].ms:0;
  el.textContent=fmtT(t);
  el.classList.remove('on'); el.classList.add('fi');
}
/* refresca botons i llista de tocats SENSE tocar el cronòmetre en marxa */
function refrescaTaps(){
  const g=joc(S.provaActual), E=S.entrada;
  const esTemps=g.mesura==='temps';
  const tocats=E.taps.map(t=>t.eid), pendents=S.equips.filter(e=>!tocats.includes(e.id));
  const cTaps=document.querySelector('.taps');
  if(cTaps) cTaps.innerHTML=pendents.map(e=>`<button class="tap" data-tap="${e.id}" style="--c:${COLORS[e.c]}">
      <span class="eq-d">${S.equips.indexOf(e)+1}</span><span class="nm">${esc(e.nom)}</span></button>`).join('');
  // llista de tocats
  let cTap=document.querySelector('.tapped');
  const htmlTap = E.taps.length ? `<p class="mini">${g.inversa?'Ordre d\u2019eliminació':'Ordre registrat'}</p>`
      +E.taps.map((t,i)=>{const e=S.equips.find(x=>x.id===t.eid);
        return `<div class="tr"><span class="tr-i">${i+1}</span><span class="nm">${esc(e.nom)}</span>${esTemps?`<span class="tr-t">${fmtT(t.ms)}</span>`:''}</div>`;}).join('')
      +`<button class="btn-sm" id="desfes" style="margin-top:8px">Desfés l\u2019últim</button>` : '';
  if(!cTap && htmlTap){ cTap=document.createElement('div'); cTap.className='tapped'; (cTaps&&cTaps.parentNode||document.getElementById('main')).appendChild(cTap); }
  if(cTap) cTap.innerHTML=htmlTap;
  const df=document.getElementById('desfes');
  if(df) df.onclick=()=>{ S.entrada.taps.pop(); refrescaTaps(); };
  const cap=document.getElementById('cap');
  if(cap) cap.disabled = E.taps.length===0;
  // si ja han tocat tots, el cronòmetre s'acaba; si es desfà, torna a comptar
  if(esTemps && E.t0){
    if(haAcabat(g)){ acabaCrono(); xiulet(); flaix(); }
    else if(!cronoInt){ const el=document.getElementById('crono');
      if(el) el.classList.remove('fi'), el.classList.add('on');
      arrencaCrono(); }
  }
  // la música de consignes s'atura sola quan la prova s'ha acabat
  if((g.eines||[]).includes('consignes') && EI.consig.fase!=='aturat' && haAcabat(g)){
    consigParaTot(); pintaEines();
  }
}
function construeixFiles(){
  const g=joc(S.provaActual), E=S.entrada;
  let ord=[];
  if(g.mesura==='punts'){
    // qui no ha modificat el número compta com a 0, però surt igualment
    const val=e=>{ const v=E.nums[e.id]; return (v===''||v===undefined||isNaN(+v))?0:+v; };
    const amb=[...S.equips];
    amb.sort((a,b)=>val(b)-val(a));
    ord=amb.map(e=>({eid:e.id, valor:val(e)+' '+g.unitat, cmp:val(e)}));
  } else if(g.mesura==='temps'){
    const t=[...E.taps]; t.sort((a,b)=> g.dir==='desc'?b.ms-a.ms:a.ms-b.ms);
    ord=t.map(x=>({eid:x.eid, valor:fmtT(x.ms), cmp:x.ms}));
  } else {
    const t=g.inversa?[...E.taps].reverse():[...E.taps];
    ord=t.map(x=>({eid:x.eid, valor:'', cmp:null}));
  }
  const dins=ord.map(o=>o.eid);
  S.files=[...ord.map((o,i)=>({eid:o.eid,
             tied: i>0 && o.cmp!==null && o.cmp===ord[i-1].cmp,
             absent:false, valor:o.valor})),
           ...S.equips.filter(e=>!dins.includes(e.id)).map(e=>({eid:e.id,tied:false,absent:true,valor:''}))];
}

/* Dades per a la cinemàtica final. Només diu el que és cert:
   si ningú destaca en un apartat, aquell titular no surt. */
function titularsFinals(){
  const cl=classificacio(), t=[];
  if(!S.jugades.length||!cl.length) return t;
  const maxV=Math.max(...cl.map(e=>e.vic));
  if(maxV>0){ const q=cl.filter(e=>e.vic===maxV);
    t.push({k:'Més victòries', v:q.map(e=>e.nom).join(' i '), d:`${maxV} ${maxV===1?'prova':'proves'}`}); }
  const ultims={};
  S.jugades.forEach(r=>{ let pitjor=null;
    S.equips.forEach(e=>{ const x=r.res[e.id]; if(x&&x.pos&&(!pitjor||x.pos>pitjor.pos)) pitjor={id:e.id,pos:x.pos}; });
    if(pitjor) ultims[pitjor.id]=(ultims[pitjor.id]||0)+1; });
  const maxU=Math.max(0,...Object.values(ultims));
  if(maxU>1){ const ids=Object.keys(ultims).filter(i=>ultims[i]===maxU);
    const noms=ids.map(i=>(S.equips.find(e=>e.id===i)||{}).nom).filter(Boolean);
    if(noms.length) t.push({k:'Ha patit més', v:noms.join(' i '), d:`${maxU} cops l\u2019últim`}); }
  if(S.jugades.length>=4){
    const mig=Math.floor(S.jugades.length/2); let millor=null;
    S.equips.forEach(e=>{
      const pos=r=>{const x=r.res[e.id]; return x&&x.pos?x.pos:null;};
      const a=S.jugades.slice(0,mig).map(pos).filter(Boolean), b=S.jugades.slice(mig).map(pos).filter(Boolean);
      if(a.length<2||b.length<2) return;
      const mA=a.reduce((x,y)=>x+y,0)/a.length, mB=b.reduce((x,y)=>x+y,0)/b.length;
      if(mA-mB>.7 && (!millor||mA-mB>millor.delta)) millor={nom:e.nom, delta:mA-mB};
    });
    if(millor) t.push({k:'La remuntada', v:millor.nom, d:'molt millor a la segona meitat'});
  }
  return t;
}

async function baixaImatge(){
  const btn=document.getElementById('baixa'); btn.disabled=true; btn.textContent='Dibuixant…';
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const x=cv.getContext('2d'), INK='#14120E', PAPER='#FBF7EF';
  x.fillStyle=PAPER; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(20,18,14,.07)';
  for(let i=0;i<W;i+=14) for(let j=0;j<H;j+=14) x.fillRect(i,j,2,2);
  x.fillStyle=INK; x.fillRect(0,0,W,96);
  x.fillStyle=PAPER; x.font='700 40px Anton, Impact, sans-serif'; x.textBaseline='middle';
  x.fillText('GIMCANA',56,50);
  const d=S.data, dt=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  x.fillStyle='#FFC814'; x.font='700 24px "IBM Plex Mono", monospace'; x.textAlign='right';
  x.fillText(dt,W-56,52); x.textAlign='left';
  const cl=classificacio();
  x.fillStyle=INK; x.font='400 84px Anton, Impact, sans-serif';
  const linia=(t,max)=>{const w=[];let l='';t.split(' ').forEach(p=>{if(x.measureText(l+' '+p).width>max&&l){w.push(l);l=p;}else l=l?l+' '+p:p;});w.push(l);return w;};
  let y=205; linia(S.titol.toUpperCase(),W-112).slice(0,2).forEach(l=>{x.fillText(l,56,y);y+=84;});
  x.font='700 26px "IBM Plex Mono", monospace'; x.fillStyle='#1E3FCC';
  x.fillText(`${FORMATS[S.format].etiqueta.toUpperCase()} · ${S.jugades.length} PROVES · ${S.gent.length} PARTICIPANTS`,56,y+8);
  y+=70;
  const top=y+330, amp=290, gap=22, x0=(W-(amp*3+gap*2))/2;
  const ordre=[cl[1],cl[0],cl[2]], rk=['2n','1r','3r'], hh=[225,300,180], fons=['#F0E8D8','#FFC814','#F0E8D8'];
  ordre.forEach((e,i)=>{ if(!e) return;
    const bx=x0+i*(amp+gap), bh=hh[i], by=top-bh;
    x.fillStyle=fons[i]; x.fillRect(bx,by,amp,bh);
    x.strokeStyle=INK; x.lineWidth=4; x.strokeRect(bx,by,amp,bh);
    x.fillStyle=INK; x.textAlign='center';
    x.font='400 62px Anton, Impact, sans-serif'; x.fillText(rk[i],bx+amp/2,by+52);
    x.font='400 34px Anton, Impact, sans-serif';
    let nm=e.nom.toUpperCase(); while(x.measureText(nm).width>amp-24&&nm.length>3) nm=nm.slice(0,-1);
    x.fillText(nm,bx+amp/2,by+bh-64);
    x.font='700 30px "IBM Plex Mono", monospace'; x.fillText(e.total+' pts',bx+amp/2,by+bh-26);
    x.textAlign='left';
  });
  let ty=top+62;
  x.strokeStyle=INK; x.lineWidth=4; x.beginPath(); x.moveTo(56,ty); x.lineTo(W-56,ty); x.stroke(); ty+=14;
  cl.forEach((e,i)=>{
    if(ty>H-190) return;
    x.fillStyle=INK; x.font='400 40px Anton, Impact, sans-serif'; x.fillText(`${i+1}${suf(i+1)}`,56,ty+30);
    x.font='500 34px "Space Grotesk", system-ui, sans-serif';
    let nm=e.nom; while(x.measureText(nm).width>560&&nm.length>3) nm=nm.slice(0,-1);
    x.fillText(nm,150,ty+30);
    x.font='700 34px "IBM Plex Mono", monospace'; x.textAlign='right'; x.fillText(String(e.total),W-56,ty+30);
    if(e.vic){ x.font='700 22px "IBM Plex Mono", monospace'; x.fillStyle='#F0286E'; x.fillText(e.vic+'×1r',W-150,ty+30); }
    x.textAlign='left'; ty+=56;
    x.strokeStyle='rgba(20,18,14,.18)'; x.lineWidth=2; x.beginPath(); x.moveTo(56,ty-12); x.lineTo(W-56,ty-12); x.stroke();
  });
  x.fillStyle=INK; x.fillRect(0,H-120,W,120);
  x.fillStyle=PAPER; x.font='500 22px "Space Grotesk", system-ui, sans-serif';
  let proves=S.jugades.map(r=>joc(r.gid).nom).join(' · ');
  while(x.measureText(proves).width>W-112&&proves.length>10) proves=proves.slice(0,-4)+'…';
  x.fillText(proves,56,H-60);
  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob), zone=document.getElementById('imgzone');
    zone.innerHTML=`<div class="imgout"><img src="${url}" alt="Resultats"><p class="hint">Al mòbil, prem i mantén la imatge per desar-la.</p></div>`;
    const a=document.createElement('a');
    a.href=url; a.download=(S.titol||'gimcana').replace(/[^\w\-]+/g,'_').toLowerCase()+'.png';
    document.body.appendChild(a); try{ a.click(); }catch(e){} a.remove();
    btn.disabled=false; btn.textContent='Baixa la imatge';
    zone.scrollIntoView({behavior:'smooth',block:'center'});
  },'image/png');
}

/* =========================================================
   ESDEVENIMENTS
   ========================================================= */
document.addEventListener('click', e=>{
  const dd=e.target.closest('[data-dif]');
  if(dd){
    const v=dd.dataset.dif, g=joc(S.provaActual);
    if(v==='!'){ iniSorteig(g, EI.sorteig.dif, true); }          // una altra amb la mateixa dificultat
    else if(v==='?'){ EI.sorteig.triat=false; }                   // torna al selector de dificultat
    else { iniSorteig(g, v==='*'?null:v, true); }                 // tria feta
    pintaEines(); return;
  }
  const ei=e.target.closest('[data-eina]');
  if(ei){
    const k=ei.dataset.eina, g=joc(S.provaActual);
    if(k==='consignes'){ consigGo(g); }
    else if(k==='sorteig'){
      if(g.puntuaTorn){
        const pool=S.equips.length?S.equips:S.gent, qui=pool[(EI.torn||0)%Math.max(pool.length,1)];
        if(qui) EI.punts[qui.id]=(EI.punts[qui.id]||0)+1;
      }
      seguent(); if(S.pantalla==='entrada') render(); else pintaEines();
    }
    else if(k==='revela'){ EI.sorteig.vist=true;
      // si la prova té compte enrere i està aturat, arrenca sol en revelar
      if((g.eines||[]).includes('compte') && !EI.compte.corrent) compteGo();
      else if(S.pantalla==='entrada') render(); else pintaEines(); }
    else if(k==='compte'){ compteGo(); }
    else if(k==='compte-rst'){ if(EI.compte.int) clearInterval(EI.compte.int);
      EI.compte={...EI.compte,int:null,restant:EI.compte.total,corrent:false,fet:false};
      if(g.puntuaTorn){ EI.punts={}; EI.torn=0; EI.sorteig.vist=false; }
      if(S.pantalla==='entrada') render(); else pintaEines(); }
    else if(k==='musica'){ musicaGo(g); }
    else if(k==='torn-seg'){ vibra(35); const pool=S.equips.length?S.equips:S.gent; EI.torn=((EI.torn||0)+1)%Math.max(pool.length,1); EI.sorteig.vist=false;
      if((g.eines||[]).includes('sorteig')) seguent();
      if(S.pantalla==='entrada') render(); else pintaEines(); }
    return;
  }
  const nb=e.target.closest('[data-normes]');
  if(nb){ normesObertes=!normesObertes; render(); return; }
  const aj=e.target.closest('[data-aj]');
  if(aj){ const v=aj.dataset.aj;
    if(v==='tanca'&&(aj.classList.contains('alerta-bg')||aj.classList.contains('btn-cta'))){ S.pantallaAjustos=false; render(); return; }
    if(v==='vibra'||v==='so'||v==='veuon'){ posaPref(v,!pref(v,true)); if(v==='vibra') vibra(40); render(); }
    return; }
  const t=e.target.closest('[data-del],[data-format],[data-neq],[data-lloc],[data-taula],[data-mat],[data-pre],[data-rondes],[data-preset],[data-tie],[data-abs],[data-mou],[data-tap],[data-mou-mem],[data-veu],[data-benv],[data-gg],[data-pm],[data-joc]');
  if(!t) return; const D=t.dataset;
  if(D.veu!==undefined){ triaVeu(D.veu); render(); return; }
  if(D.joc!==undefined){
    if(D.joc==='juga'){
      const g=joc(S.provaActual), nums={};
      if(g.puntuaTorn) (S.equips.length?S.equips:S.gent).forEach(p=>{ if(EI.punts[p.id]) nums[p.id]=String(EI.punts[p.id]); });
      S.entrada={taps:[],t0:null,nums}; S.pantalla='entrada';
    } else S.pantalla='prova';
    render(); return;
  }
  if(D.benv!==undefined){
    S.vistBenvinguda=true; try{ localStorage.setItem('gimcana_vist','1'); }catch(e){}
    render(); return;
  }
  if(D.gg!==undefined){
    const [acc,eid]=D.gg.split('|');
    if(acc==='obre'){ S.gestioGent=true; render(); return; }
    if(acc==='tanca'){ S.gestioGent=false; render(); return; }
    if(acc==='fora'){
      S.equips=S.equips.filter(x=>x.id!==eid);
      S.gent=S.gent.filter(p=>p.id!==eid);
      S.equips.forEach(x=>{ if(x.membres) x.membres=x.membres.filter(m=>m!==eid); });
      vibra(20); render(); return;
    }
  }
  if(D.pm!==undefined){
    const [sig,eid]=D.pm.split('|'); const E=S.entrada; if(!E) return;
    const ara=+(E.nums[eid]||0), nou=Math.max(0, sig==='+'?ara+1:ara-1);
    E.nums[eid]=String(nou); vibra(12); render(); return;
  }
  if(D.del){ S.gent=S.gent.filter(p=>p.id!==D.del); ferEquips(); render(); }
  else if(D.format){ S.format=D.format; ferEquips(); render(); }
  else if(D.neq){ S.nEquips=+D.neq; ferEquips(); render(); }
  else if(D.lloc){ S.lloc=D.lloc; render(); }
  else if(D.taula!==undefined){ S.sobretaula=!S.sobretaula; render(); }
  else if(D.mat){ S.inventari.has(D.mat)?S.inventari.delete(D.mat):S.inventari.add(D.mat); render(); }
  else if(D.pre!==undefined){ S.inventari=new Set(PREDEFINITS[+D.pre].mat); render(); }
  else if(D.rondes!==undefined){ S.rondes=+D.rondes; render(); }
  else if(D.preset){ S.preset=D.preset; S.punts=PRESETS[D.preset].gen(Math.max(S.equips.length,3)); render(); }
  else if(D.tie!==undefined){ S.files[+D.tie].tied=!S.files[+D.tie].tied; render(); }
  else if(D.abs!==undefined){ const i=+D.abs; S.files[i].absent=!S.files[i].absent; if(S.files[i].absent) S.files[i].tied=false; render(); }
  else if(D.mou){ const [i,d]=D.mou.split(':').map(Number), k=i+d;
    if(k<0||k>=S.files.length) return;
    [S.files[i],S.files[k]]=[S.files[k],S.files[i]];
    S.files.forEach((f,j)=>{ if(j===0) f.tied=false; }); render(); }
  else if(D.tap){ const g=joc(S.provaActual);
    S.entrada.taps.push({eid:D.tap, ms:g.mesura==='temps'&&S.entrada.t0?Date.now()-S.entrada.t0:0});
    if(g.mesura==='temps' && S.entrada.t0){ refrescaTaps(); }
    else {
      if((g.eines||[]).includes('consignes') && EI.consig.fase!=='aturat' && haAcabat(g)) consigParaTot(true);
      render();
    } }
  else if(D.mouMem){
    const pid=D.mouMem, i=S.equips.findIndex(e=>e.membres.includes(pid));
    if(i<0||S.equips.length<2) return;
    const j=(i+1)%S.equips.length;
    S.equips[i].membres=S.equips[i].membres.filter(m=>m!==pid);
    S.equips[j].membres.push(pid);
    if(S.format==='par') S.equips.forEach(recalcNom);
    S.equips=S.equips.filter(e=>e.membres.length); render(); }
});
document.addEventListener('change', e=>{
  const D=e.target.dataset;
  if(D.pt!==undefined){ S.punts[+D.pt]=Math.max(0,Math.min(99,+e.target.value||0)); render(); }
});
document.addEventListener('input', e=>{
  const D=e.target.dataset;
  if(D.eqnom!==undefined){
    const q=S.equips.find(x=>x.id===D.eqnom);
    if(q){ q.nom=e.target.value; refrescaResum(); desa(); }
    return;
  }
  if(D.num!==undefined){ S.entrada.nums[D.num]=e.target.value;
    const b=document.getElementById('cap'); if(b) b.disabled=!Object.values(S.entrada.nums).some(v=>v!==''); }
});
/* avís abans de perdre una sessió a mig fer */
if(typeof window!=='undefined' && window.addEventListener){
  window.addEventListener('beforeunload', ev=>{
    if(S.jugades.length && S.pantalla!=='podi' && S.pantalla!=='muntatge'){ ev.preventDefault(); ev.returnValue=''; }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && S.pantalla!=='muntatge') mantenirPantalla();
  });
}
/* les veus del navegador solen arribar amb retard: quan siguin a punt, refresca si toca */
if(typeof window!=='undefined' && window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged=()=>{ if(S.pantalla==='muntatge') render(); };
}

(async ()=>{
  try{
    const d=await Magatzem.get(CLAU);
    if(d && (d.gent||[]).length && (d.jugades||[]).length && d.pantalla!=='podi') pendent=d;
    const pr=await Magatzem.get(CLAU_PREF);
    if(pr){
      if(FORMATS[pr.format]) S.format=pr.format;
      if([2,3,4].includes(pr.nEquips)) S.nEquips=pr.nEquips;
      if(['in','out','both'].includes(pr.lloc)) S.lloc=pr.lloc;
      if(typeof pr.sobretaula==='boolean') S.sobretaula=pr.sobretaula;
      if((pr.inventari||[]).length) S.inventari=new Set(pr.inventari.filter(m=>MATERIAL[m]));
      if([3,5,10].includes(pr.rondes)) S.rondes=pr.rondes;
      if(PRESETS[pr.preset]) S.preset=pr.preset;
    }
  }catch(e){}
  render();
})();

</script>

/* Registra el service worker: fa que l'app funcioni sense connexió un cop carregada.
   Si s'obre com a fitxer local (file://) no es registra i no passa res. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
